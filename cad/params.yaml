# CroXY master parameters. Units mm. Every part in build.py reads from here.
# World frame: origin at the centre of the top plate's underside, +X right, +Y back, +Z up.
# Rails, belts, pulleys and beams sit on top of the plate (out of the chamber); the toolhead
# hangs from the beams through a central cutout.

build: {x: 180, y: 180, z: 180}

frame:
  plate_w: 380          # top plate, square; also the frame outline
  plate_t: 12           # mild steel, waterjet then machined
  cutout: 246           # square toolhead cutout (toolhead envelope at full travel + 3 mm a side)
  shutter_h: 15         # height kept clear above the plate for a sliding insulated shutter over the cutout
  post: 3030
  post_center: 175      # posts at (+-175, +-175)
  chamber_h: 290        # top plate underside to floor plate top

xy:
  belt_line: 143        # each belt runs directly above its MGN12 rail
  pulley_pos: 126       # drive and idler centres at +-126 along their belt
  pitch_r: 6.37         # 20T GT2 pitch radius
  belt_w: 12
  belt_t: 1.4
  belt_z: 39            # belt centre height (plate top is 12)
  tension_travel: 6     # idler slot travel (moves away from its drive)
  rail_off: 143         # MGN12 perimeter rails at +-143, on the plate top
  rail_len: 230
  motor_len: 76

gantry:
  beam_len: 290
  beam_w: 25
  beam_h: 25
  beam_t: 3             # bent U channel, mild steel or 4130 (Send Cut Send)
  beam_rail_len: 250    # MGN9 (ends clear the towers)
  y_beam_bot: 47        # Y beam (spans X, moves in Y): lower beam, sits on the Y-end towers
  x_beam_bot: 90        # X beam (spans Y, moves in X): upper beam, sits on the X-end towers
  travel: 90            # toolhead centre travels +-90 in X and Y

toolhead:
  envelope: [60, 60]    # Chube Conduction + Sherpa Heavy stand-in footprint
  height: 84            # yoke underside to nozzle tip
