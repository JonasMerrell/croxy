# CroXY master parameters. Units mm. Every part in build.py reads from here.
# World frame: origin at the centre of the top plate's underside, +X right, +Y back, +Z up.
# Rails, belts, pulleys and beams sit on top of the plate (out of the chamber); the toolhead
# hangs from the beams through a central cutout.

build: {x: 180, y: 180, z: 180}

frame:
  plate_w: 380          # top plate, square; also the frame outline
  plate_t: 12           # mild steel, waterjet then machined
  cutout: 246           # square toolhead cutout (toolhead envelope at full travel + 3 mm a side)
  shutter_h: 15         # height kept clear above the plate for a sliding insulated shutter over the cutout
  post: 3030
  post_center: 175      # posts at (+-175, +-175)
  chamber_h: 254        # top plate underside to floor plate top (66 shorter since the extruder moved above the plate)

xy:
  belt_line: 143        # each belt runs directly above its MGN12 rail
  pulley_pos: 126       # drive and idler centres at +-126 along their belt
  pitch_r: 6.37         # 20T GT2 pitch radius
  belt_w: 12
  belt_t: 1.4
  belt_z: 39            # belt centre height (plate top is 12)
  tension_travel: 8     # idler slot travel, away from its drive (max before the idler meets the drive pulley)
  rail_off: 143         # MGN12 perimeter rails at +-143, on the plate top
  rail_len: 230
  motor_len: 76

gantry:
  beam_len: 290
  beam_w: 25
  beam_h: 25
  beam_t: 3             # bent U channel, mild steel or 4130 (Send Cut Send)
  beam_rail_len: 250    # MGN9 (ends clear the towers)
  y_beam_bot: 86        # Y beam (spans X, moves in Y): lower beam, sits on the Y-end towers
  x_beam_bot: 129        # X beam (spans Y, moves in X): upper beam, sits on the X-end towers
  travel: 90            # toolhead centre travels +-90 in X and Y

toolhead:
  # The extruder rides above the plate in the gantry bay, under the yoke; only the hotend and the duct riser
  # drop through the shutter and the cutout. The beams were raised 39 mm to make room for it (2026-11-09).
  offset: [18, 15.5]    # nozzle / filament axis from the beam cross; the PTFE tube rises between the Y beam and the yoke leg
  nozzle_z: -20         # nozzle tip (Beacon and duct ring just clear the plate underside)
  filament_top: 160     # PTFE tube modelled straight up to here (above the X beam); it bends to the lid port above
  # Centre of mass on the beam cross (both MGN9 rail lines): the motor sits across the cross as the counterweight.
  # frame_rot and motor_face_u are solved by: python3 cad/toolhead.py (paste the solved values here)
  frame_rot: 51.93
  motor_face_u: -8.62
  mass_g:               # bought parts, estimates: weigh the real ones and update, then re-solve
    motor: 125          # 36 mm round pancake class (runs in the gantry bay now, not the chamber)
    gearbox: 55         # Sherpa-style housing, gears, drive shafts, bearings, idler arm
    hotend: 55          # Chube Conduction with nozzle, heater and thermistor
    beacon: 8
    coupling: 6
    wiring: 15
    mgn9h: 26

shell:
  shear_t: 6            # steel shear plates on the inner faces of the posts: left, right, back (front is the door)
  floor_t: 6            # steel floor plate under the posts (6 mm: less thermal mass, still stiff)
  floor_insulation: 30
  z_bay: 60             # cool bay under the floor for the Z motors
  tray_t: 8

z:
  z12_y: -60            # Z1 (left) and Z2 (right) rails sit on the side plates at this Y
  z3_x: 18              # Z3 rail sits on the back plate at this X (the build centre's X)
  rail_len: 230
  belt_offset: -25      # belt loop beside the rail, in the column's own frame
  belt_x: 18            # belt centre plane, inward from the shear plate face
  idler_z: -19          # top idler, level with the bed top at the top of its travel
  motor_z: -337         # Z drive jackshaft axis, in the cool bay under the floor insulation
  reduction: {small_t: 20, big_t: 60, centre: 52.45, loop: "188 mm GT2 6 mm"}   # 1:3 so the bed holds when the motors are off
  carriage_drop: 20     # Z carriage centre below the bed top

bed:
  size: 200             # MIC6, centred on the build centre (toolhead offset)
  t: 8
  heater_t: 2
  arm: 20               # square steel arms from each Z carriage to the bed
  arm_inset: 20         # arm reaches this far in under the bed edge

enclosure:
  hot_layer: 20         # hot-face layer (aerogel blanket or mineral wool board, rated >= 250 C) so the PIR stays below its limit
  pir: 30               # polyisocyanurate board
  skin: 2               # aluminium sheet, outside
  bay_h: 60             # cool Z bay under the floor insulation (Z drives, heater fan motor)
  base_t: 6             # aluminium base plate
  feet_h: 15
  support: 30           # G10 blocks under the floor plate corners (thermal break), on 3030 legs in the bay
  lid_z: 249            # top bay lid (over the NEMA23s)
  window: {w: 260, h: 200, cz: -143}   # door window, centred on the build centre in X
  glass_t: 4

shutter:                # cross shutter over the plate cutout. A strip moves in Y with the neck; 0.05 mm stainless
  strip_t: 2            # spring-tape covers close the cutout front/back of the strip (rollers in pockets in the plate
  roller_r: 4           # top, just outside the cutout) and left/right of the neck (rollers on the strip ends)
  y_roller_r: 4.5

heater:                 # PTC heater + blower on the chamber floor, left side; blower motor in the cool bay
  x: [-150, -92]
  y: [5, 135]
  top: -134
  power_w: 800         # 2 x 400 W PTC; heat-up about 50 min (300 W would take about 3 h)

back_module:
  depth: 110
  split_z: -104         # filter loop above, electronics below
