# CroXY spec (rev B layout approved 2026-11-07; numbers updated by the first gantry model)
# Geometry that drives the CAD lives in cad/params.yaml.
# Units: mm, degC. Origin: center of the top plate's underside; +X right, +Y back, +Z up.
# Every model part should read its dimensions from here.

build:
  x: 180
  y: 180
  z: 180

chamber:
  temp_max: 150
  interior: {x: 380, y: 380, h: 320}   # inside the frame (frame sits inside insulation)
  heater: {type: PTC, power_w: 300, location: "chamber floor, left side, beside the bed", fan: "blower wheel on a shaft through the floor; BLDC motor in the cool Z bay"}

insulation:
  hot_face: {thickness: 15, material: "aerogel blanket (Pyrogel XTE class) or mineral wool board, rated >= 250 C"}
  pir: {thickness: 30, note: "kept below its continuous limit by the hot-face layer"}
  skin: {thickness: 2, material: "aluminium sheet, powder coated"}
  floor: "same build-up under the floor plate; the floor plate stands on four G10 blocks (thermal breaks) on 3030 legs"

frame:
  posts: {profile: "3030", count: 4, positions: [FL, FR, BL, BR]}
  post_length: 320
  shear_plates: {material: mild_steel, thickness: 6, sides: [left, right, back], note: "bolted inside the posts; the side plates carry Z1/Z2, the back plate carries Z3 (replaces the back centre post). Steel, so the MGN12 Z rails match CTE"}
  top_plate: {material: mild_steel, thickness: 12, size: [380, 380], process: "waterjet + stress relieve + finish machine"}
  floor_plate: {material: mild_steel, thickness: 10, size: [380, 380]}

xy:
  kinematics: cross_xy
  motors: {type: NEMA23, count: 4, layout: pinwheel, mount: top_of_plate, standoff: {material: G10, height: 30}, coupling: "motor drives an 8 mm shaft through a coupling; shaft runs in two 608s in the corner block (double shear)"}
  belt: {type: "Gates EPDM GT2", width: 12}
  location: "on top of the plate, out of the chamber; toolhead drops through a 246 mm cutout with a sliding insulated shutter"
  pulley_support: double_shear
  belt_offset_from_center: 143   # directly above the MGN12 rail
  pulley_offset_along_belt: 126
  tensioning: "slotted idler in the corner block, 6 mm travel, adjusted from above the plate"
  corner_block: "one steel block per corner carries that corner's drive pulley and the other belt's idler"
  perimeter_rails: {type: MGN12, offset_from_center: 143, length: 230, mount: plate_top}
  beams:
    rail: MGN9
    backer: {material: [mild_steel, "4130"], source: SendCutSend, form: bent_U_channel_TBD, rail_face: finish_machined}
    span: 290
    sizing: dynamic_sim_TBD
  toolhead_envelope: [60, 60, 84]
  yoke: "aluminium yoke carries both MGN9H carriages and wraps the Y beam"

z:
  motors: {type: NEMA17, count: 3, location: "below the floor plate, on steel mounts; belts pass through slots in the floor"}
  columns: {Z1: "left plate, y -60", Z2: "right plate, y -60", Z3: "back plate, x 18"}
  drive: "closed GT2 12 mm loop per column: 20T drive below the floor, 20T idler at z -85; the bed arm clamps the inner strand"
  rails: {type: MGN12, count: 3, length: 230, mount: "screwed straight to the steel shear plates"}
  reduction: "1:3 per column: NEMA17 20T -> 60T on an 8 mm jackshaft (two 608s in the steel mount), GT2 6 mm 188 mm closed loop, tensioned by slotted motor holes"
  holding: "with ~2 kg moving, each motor sees ~0.014 N.m at power-off, about equal to a NEMA17's detent torque; add a brake or go 1:4 if the bed creeps"
  leveling: klipper_z_tilt
  travel: 180

bed:
  material: MIC6
  size: [200, 200]
  thickness: 8
  centre: [18, 25]   # under the nozzle
  heater: silicone, under the plate
  arms: "one steel arm per column, from the MGN12H to a pad under the bed; 20 mm in from the bed edge"
  surface: magnetic_sheet   # clips as backup

toolhead:
  hotend: Chube_Conduction
  extruder: Sherpa_Heavy_or_CNC_equivalent
  extruder_motor: LDO_high_temp
  part_cooling: "server-type blower fixed in the gantry bay, hose to the neck; air goes down the hollow neck to a ring duct at the nozzle"
  probe: Beacon3D
  layout: "extruder and hotend offset (18, 25) from the beam cross into an open quadrant; straight PTFE feed from above; body hangs below the plate on a neck"

stack_heights:        # from the floor up (h); world z = h - 456
  feet: [0, 15]
  base_plate: [15, 21]
  z_bay: [21, 81]          # Z drives, heater blower motor (cool)
  floor_insulation: [81, 126]
  floor_plate: [126, 136]
  chamber: [136, 456]
  top_plate: [456, 468]
  gantry_bay: [468, 666]   # ventilated by two 80 mm fans; part-cooling blower lives here
  lid: [666, 668]
  nozzle_tip: 370

shutter:
  concept: "a strip moving in Y with the neck covers the cutout's middle band; 0.05 mm stainless spring-tape covers close it front/back (rollers in 10 mm pockets in the plate top, just outside the cutout) and left/right of the neck (rollers on the strip ends)"
  note: "tape covers block convection and, polished, cut radiation; fabric/bellows would not fit, there is only about 6 mm between the cutout edge and the X carriages"

back_module:
  depth: 110
  upper: {contents: filter_loop, parts: [air-to-air cooler, HEPA H13, activated_carbon, radial blower 97 mm], ducts: "two 40 mm stainless ducts through the back wall at z -45 (outlet x -120, return x 130)"}
  lower: {contents: electronics, parts: [BTT_Kraken, PSU 48 V (LRS-350-48 class), PSU 24 V (LRS-150-24 class), host + relays, two 80 mm fans], access: hinged_rear_cover}

door:
  location: front
  type: "insulated (same build-up as the walls), hinged on the left"
  window: {w: 260, h: 230, glazing: "double: borosilicate inner, tempered outer, 4 mm each, ~31 mm air gap"}

outer_envelope: {w: 474, d: 586, h: 668}   # modelled; the door handle adds 30 in front
